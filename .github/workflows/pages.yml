name: Test and deploy arcade
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the repository path
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check the production site and controller menus
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          ARCADE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: |
          npm run preview -- --port 4173 > /tmp/arcade-preview.log 2>&1 &
          sleep 2
          npm run test:deployment
          npm run test:controller
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
